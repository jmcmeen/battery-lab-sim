schedule_id: demo_5cycle
chemistry: NMC
chamber:
  setpoint_c: 25.0
  soak_seconds: 0
# Shallow window (3.55V → 3.95V terminal at 1C, ≈0.2 SOC swing) over 2 cycles.
# Picked so a wall-clock demo at SIM_TIME_FACTOR=50 wraps in ≈1 minute while
# still exercising every step type (cc / rest / cc / rest). Real cycle-life
# schedule with deep cycles lives in cycle_life_25C.yaml.
steps:
  - {name: cc_charge,     type: cc, rate_c: 1.0,  end_when: {voltage_v_above: 3.95, max_duration_s: 1500}}
  - {name: rest_top,      type: rest, duration_s: 5}
  - {name: cc_discharge,  type: cc, rate_c: -1.0, end_when: {voltage_v_below: 3.55, max_duration_s: 1500}}
  - {name: rest_bottom,   type: rest, duration_s: 5}
cycle:
  repeat: 2
