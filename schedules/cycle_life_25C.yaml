schedule_id: cycle_life_25C
chemistry: NMC
bench:
  chassis: 1-8               # 25 °C cycle-life run → Chamber A (cyclers 01-08)
  channels_per_chassis: 32
chamber:
  setpoint_c: 25.0
  soak_seconds: 0          # chamber control not yet wired in this milestone
steps:
  - {name: initial_rest,  type: rest, duration_s: 600}
  - {name: cc_charge,     type: cc, rate_c: 0.5, end_when: {voltage_v_above: 4.20, max_duration_s: 9000}}
  - {name: cv_charge,     type: cv, voltage_v: 4.20, end_when: {current_a_below_c_rate: 0.05, max_duration_s: 7200}}
  - {name: rest_top,      type: rest, duration_s: 600}
  - {name: cc_discharge,  type: cc, rate_c: -1.0, end_when: {voltage_v_below: 3.00, max_duration_s: 5400}}
  - {name: rest_bottom,   type: rest, duration_s: 600}
cycle:
  repeat: 1000
