schedule_id: soak_25c_nmc
chemistry: NMC
bench:
  chassis: 1-8               # Chamber A is 25 °C → cyclers 01-08 (docker-compose.yml)
  channels_per_chassis: 32
chamber:
  setpoint_c: 25.0
  soak_seconds: 1800         # 30-minute initial chamber soak before cycling
# v0.1.8: phone-grade NMC soak at 25 °C. Voltage cutoffs reflect NMC's
# phone-grade 4.40 V V_max (bumped from 4.20 V in v0.1.7 and earlier).
# Chamber A defaults LCO in docker-compose, but the orchestrator writes
# the chassis CHEMISTRY register at kickoff and the cycler rebuilds its
# cells to NMC — no .env override required.
#
# C-rates are intentionally asymmetric: 0.5 C charge / 1.0 C discharge
# mirrors real benchtop practice (slow charge extends cycle life, faster
# discharge captures the usage-side knee).
steps:
  - {name: initial_rest,   type: rest, duration_s: 600}
  - {name: cc_charge,      type: cc, rate_c: 0.5,  end_when: {voltage_v_above: 4.40, max_duration_s: 9000}}
  - {name: cv_charge,      type: cv, voltage_v: 4.40, end_when: {current_a_below_c_rate: 0.05, max_duration_s: 7200}}
  - {name: rest_top,       type: rest, duration_s: 600}
  - {name: cc_discharge,   type: cc, rate_c: -1.0, end_when: {voltage_v_below: 3.00, max_duration_s: 5400}}
  - {name: rest_bottom,    type: rest, duration_s: 600}
cycle:
  repeat: 1000
