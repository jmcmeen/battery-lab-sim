schedule_id: soak_45c
chemistry: NMC
# Elevated-temperature accelerated aging — same C-rates as soak_25c but at
# chamber B's 45 °C setpoint. Aging coefficients in batterylab.degradation
# scale with temperature (Arrhenius), so this experiment ages cells faster
# than soak_25c and produces visible dQ/dV peak shift in fewer cycles —
# the contrast with soak_25c is the analytics demo story.
chamber:
  setpoint_c: 45.0
  soak_seconds: 1800
steps:
  - {name: initial_rest,   type: rest, duration_s: 600}
  - {name: cc_charge,      type: cc, rate_c: 0.5,  end_when: {voltage_v_above: 4.20, max_duration_s: 9000}}
  - {name: cv_charge,      type: cv, voltage_v: 4.20, end_when: {current_a_below_c_rate: 0.05, max_duration_s: 7200}}
  - {name: rest_top,       type: rest, duration_s: 600}
  - {name: cc_discharge,   type: cc, rate_c: -1.0, end_when: {voltage_v_below: 3.00, max_duration_s: 5400}}
  - {name: rest_bottom,    type: rest, duration_s: 600}
cycle:
  repeat: 1000
