schedule_id: soak_25c
chemistry: NMC
bench:
  chassis: 1-8               # Chamber A is 25 °C → cyclers 01-08 (docker-compose.yml)
  channels_per_chassis: 32
chamber:
  setpoint_c: 25.0
  soak_seconds: 1800        # 30-minute initial chamber soak before cycling
# C-rates are intentionally asymmetric: 0.5C charge / 1.0C discharge mirrors
# real benchtop practice (slow charge extends cycle life, faster discharge
# captures the usage-side knee). CE values reported by analytics will sit
# slightly above 1.0 in long-running soaks because the ECM's q_effective
# shrinks faster than coulomb-counted throughput once cumulative aging
# kicks in (sqrt-LLI + LAM) — a property of the simulator, not an analytics
# bug. Real cells are bounded by energy conservation; the sim is bounded
# by SOC ∈ [0, 1] only.
steps:
  - {name: initial_rest,   type: rest, duration_s: 600}
  - {name: cc_charge,      type: cc, rate_c: 0.5,  end_when: {voltage_v_above: 4.20, max_duration_s: 9000}}
  - {name: cv_charge,      type: cv, voltage_v: 4.20, end_when: {current_a_below_c_rate: 0.05, max_duration_s: 7200}}
  - {name: rest_top,       type: rest, duration_s: 600}
  - {name: cc_discharge,   type: cc, rate_c: -1.0, end_when: {voltage_v_below: 3.00, max_duration_s: 5400}}
  - {name: rest_bottom,    type: rest, duration_s: 600}
cycle:
  repeat: 1000
