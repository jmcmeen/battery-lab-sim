apiVersion: 1

# Two datasources, hand-pinned UIDs so dashboard JSON references are stable
# across container recreations. Per CLAUDE.md invariant #3, telemetry and
# metadata live in separate DBs and dashboards must reflect that.
datasources:
  # NOTE: Grafana provisioning supports $VAR / ${VAR} but NOT ${VAR:-default}
  # shell-style fallbacks. Keep these as plain ${VAR} — defaults belong in
  # .env.example, which docker-compose passes through verbatim.
  - name: TimescaleDB (telemetry)
    uid: tsdb-telemetry
    type: postgres
    access: proxy
    isDefault: true
    url: timescaledb:5432
    user: ${TSDB_USER}
    secureJsonData:
      password: ${TSDB_PASSWORD}
    jsonData:
      database: ${TSDB_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true

  - name: Postgres (metadata)
    uid: pg-metadata
    type: postgres
    access: proxy
    isDefault: false
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
