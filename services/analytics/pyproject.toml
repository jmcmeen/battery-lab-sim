[project]
name = "analytics"
version = "0.1.1"
description = "Cycle-feature engineering: capacity, CE, dQ/dV peaks, R0 anomaly detection."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "aiomqtt>=2.3",
  "asyncpg>=0.29",
  "numpy>=1.26",
  "scipy>=1.11",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
