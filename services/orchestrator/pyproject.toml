[project]
name = "orchestrator"
version = "0.1.0"
description = "YAML schedule executor with idempotent resume and per-channel state machines."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "pymodbus>=3.7,<3.8",
  "aiomqtt>=2.3",
  "asyncpg>=0.29",
  "transitions>=0.9",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
