[project]
name = "chamber"
version = "0.1.0"
description = "Thermal chamber service — first-order ambient model + Modbus + MQTT publish."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "pymodbus>=3.7,<3.8",
  "aiomqtt>=2.3",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chamber"]
