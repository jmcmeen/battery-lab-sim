[project]
name = "watchdog"
version = "0.1.7"
description = "Reliability monitor — orchestrator heartbeat, chassis dead-man, chamber drift → alerts table + MQTT."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "aiomqtt>=2.3",
  "asyncpg>=0.29",
  "pymodbus>=3.7,<3.8",
  "structlog>=24.1",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdog"]
