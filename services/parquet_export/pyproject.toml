[project]
name = "parquet_export"
version = "0.1.4"
description = "Daily TSDB → MinIO Parquet exporter. Hive-partitioned for DuckDB partition pruning."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "asyncpg>=0.29",
  "pyarrow>=17.0",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet_export"]
