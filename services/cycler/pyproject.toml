[project]
name = "cycler"
version = "0.1.4"
description = "Multi-channel battery cycler service — Modbus TCP + cell tasks + safety + telemetry."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "pymodbus>=3.7,<3.8",
  "aiomqtt>=2.3",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cycler"]
