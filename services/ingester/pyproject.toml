[project]
name = "ingester"
version = "0.1.7"
description = "MQTT → TimescaleDB COPY ingester."
requires-python = ">=3.11"
dependencies = [
  "batterylab",
  "aiomqtt>=2.3",
  "asyncpg>=0.29",
  "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingester"]
