[project]
name = "batterylab"
version = "0.1.6"
description = "Shared library: cell physics, modbus map, schedule schema, sim time."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batterylab"]
