# Battery Lab Simulator — full bench: 16 cyclers × 32 channels = 512.
# Cyclers split across two thermal chambers (A: 01–08, B: 09–16).

name: battery-lab-sim

x-common-env: &common-env
  SIM_TIME_FACTOR: ${SIM_TIME_FACTOR:-10}
  TELEMETRY_HZ: ${TELEMETRY_HZ:-10}
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883
  PYTHONUNBUFFERED: "1"

# Auto-restart all services. The watchdog has no watchdog of its own, so if
# any monitor crashes, Docker brings it back. v0.3-reliability invariant.
x-restart: &restart unless-stopped

# Container log rotation. Default Docker json-file driver has no size cap,
# so an overnight soak at 5,120 rows/s × structlog JSON fills the host disk
# (logs live in /var/lib/docker/containers/<id>/<id>-json.log and are only
# reclaimed when the container is removed — which is why `docker compose
# down` returns the disk space). Cap each container at max-size × max-file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-50m}"
    max-file: "${LOG_MAX_FILE:-5}"

# Shared cycler service shape — 16 instances differ only in CHASSIS_ID,
# CHAMBER_ID, and host port mapping. Per CLAUDE.md invariant #2 (one
# container per chassis), each cycler is its own service block.
x-cycler-base: &cycler-base
  build:
    context: .
    dockerfile: services/cycler/Dockerfile
  networks: [lab_net]
  restart: *restart
  logging: *default-logging
  # 256 MB headroom for one chassis × 32 channels of asyncio tasks +
  # the Modbus mirror block. Verified with `docker stats` during a 1-hour
  # soak: typical RSS ~110 MB, peak ~140 MB. Bump if you raise
  # CHANNELS_PER_CYCLER above 32.
  mem_limit: 256m
  # Default Docker soft FD limit is 1024. Modbus TCP server + healthcheck
  # churn can leak sockets into that bucket faster than the TIME_WAIT
  # timer reaps them. The leak itself is fixed in modbus_server.py /
  # healthcheck.py; this is belt-and-suspenders so a regression turns
  # into a slow drift, not a 3-hour fleet trip.
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "python -m cycler.healthcheck || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6

x-chamber-base: &chamber-base
  build:
    context: .
    dockerfile: services/chamber/Dockerfile
  networks: [lab_net]
  restart: *restart
  logging: *default-logging
  mem_limit: 256m
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "python -m chamber.healthcheck || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6

networks:
  lab_net:
    driver: bridge

volumes:
  tsdb_data:
  pg_data:
  minio_data:
  grafana_data:

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    networks: [lab_net]
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: *restart
    logging: *default-logging
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 2 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    networks: [lab_net]
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: ${TSDB_USER:-lab}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-lab}
      POSTGRES_DB: ${TSDB_DB:-telemetry}
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    restart: *restart
    logging: *default-logging
    # 512 MB covers shared_buffers + WAL + Timescale chunk cache for the
    # 512-channel × 10 Hz workload. If you scale channels past ~1024, raise
    # to 1g; the COPY ingest path is the dominant memory consumer.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-lab} -d ${TSDB_DB:-telemetry}"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16
    networks: [lab_net]
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: *restart
    logging: *default-logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-lab}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    networks: [lab_net]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    volumes:
      - minio_data:/data
    restart: *restart
    logging: *default-logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    networks: [lab_net]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Datasource provisioning reads ${VAR} interpolation from env, so
      # forward DB credentials so the YAML can stay generic.
      TSDB_USER: ${TSDB_USER:-lab}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-lab}
      TSDB_DB: ${TSDB_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: *restart
    logging: *default-logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      timescaledb: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # ---- Thermal chambers --------------------------------------------------
  chamber_a:
    <<: *chamber-base
    environment:
      <<: *common-env
      CHAMBER_ID: "A"
      CHAMBER_SETPOINT_C: ${CHAMBER_A_SETPOINT_C:-25.0}
      CHAMBER_TAU_S: ${CHAMBER_TAU_S:-600.0}
      MODBUS_PORT: "502"
    depends_on:
      mosquitto: {condition: service_healthy}

  chamber_b:
    <<: *chamber-base
    environment:
      <<: *common-env
      CHAMBER_ID: "B"
      CHAMBER_SETPOINT_C: ${CHAMBER_B_SETPOINT_C:-45.0}
      CHAMBER_TAU_S: ${CHAMBER_TAU_S:-600.0}
      MODBUS_PORT: "502"
    depends_on:
      mosquitto: {condition: service_healthy}

  # ---- Cyclers (16 chassis × 32 channels = 512) --------------------------
  # Chassis 01-08 → chamber_a (25 °C). Chassis 09-16 → chamber_b (45 °C).
  # Host port mapping: cycler_NN → 502NN. Useful for ad-hoc Modbus debug;
  # not required for orchestrator/watchdog (they reach via lab_net).
  cycler_01:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "1"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_01_CHEMISTRY:-LCO}
    ports: ["5021:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_02:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "2"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_02_CHEMISTRY:-LCO}
    ports: ["5022:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_03:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "3"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_03_CHEMISTRY:-LCO}
    ports: ["5023:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_04:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "4"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_04_CHEMISTRY:-LCO}
    ports: ["5024:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_05:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "5"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_05_CHEMISTRY:-LCO}
    ports: ["5025:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_06:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "6"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_06_CHEMISTRY:-LCO}
    ports: ["5026:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_07:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "7"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_07_CHEMISTRY:-LCO}
    ports: ["5027:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_08:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "8"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "A"
      CHEMISTRY: ${CYCLER_08_CHEMISTRY:-LCO}
    ports: ["5028:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_a: {condition: service_healthy}

  cycler_09:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "9"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_09_CHEMISTRY:-NMC}
    ports: ["5029:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_b: {condition: service_healthy}

  cycler_10:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "10"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_10_CHEMISTRY:-NMC}
    ports: ["5030:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_b: {condition: service_healthy}

  cycler_11:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "11"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_11_CHEMISTRY:-NMC}
    ports: ["5031:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_b: {condition: service_healthy}

  cycler_12:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "12"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_12_CHEMISTRY:-NMC}
    ports: ["5032:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_b: {condition: service_healthy}

  cycler_13:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "13"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_13_CHEMISTRY:-NMC}
    ports: ["5033:502"]
    depends_on:
