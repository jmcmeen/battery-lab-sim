  cycler_14:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "14"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
