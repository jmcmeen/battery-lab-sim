      chamber_b: {condition: service_healthy}

  cycler_16:
    <<: *cycler-base
    environment:
      <<: *common-env
      CHASSIS_ID: "16"
      CHANNELS_PER_CYCLER: ${CHANNELS_PER_CYCLER:-32}
      MODBUS_PORT: "502"
      CHAMBER_ID: "B"
      CHEMISTRY: ${CYCLER_16_CHEMISTRY:-NMC}
    ports: ["5036:502"]
    depends_on:
      mosquitto: {condition: service_healthy}
      chamber_b: {condition: service_healthy}

  # ---- Telemetry pipeline -----------------------------------------------
  ingester:
    build:
      context: .
      dockerfile: services/ingester/Dockerfile
    networks: [lab_net]
    environment:
      <<: *common-env
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_USER: ${TSDB_USER:-lab}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-lab}
      TSDB_DB: ${TSDB_DB:-telemetry}
    depends_on:
      mosquitto: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
    restart: *restart
    logging: *default-logging
    # 512 MB headroom for the 50k-row hard buffer + COPY batches.
    # At 5120 rows/s and 1s flush cadence, in-flight batch is ~5k rows;
    # the hard cap exists for back-pressure during DB outages.
    mem_limit: 512m

  parquet_export:
    build:
      context: .
      dockerfile: services/parquet_export/Dockerfile
    networks: [lab_net]
    environment:
      <<: *common-env
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_USER: ${TSDB_USER:-lab}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-lab}
      TSDB_DB: ${TSDB_DB:-telemetry}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      PARQUET_BUCKET: ${PARQUET_BUCKET:-lab-archive}
      PARQUET_EXPORT_AGE_HOURS: ${PARQUET_EXPORT_AGE_HOURS:-24}
      PARQUET_EXPORT_PERIOD_S: ${PARQUET_EXPORT_PERIOD_S:-3600}
    depends_on:
      timescaledb: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: *restart
    logging: *default-logging
    # 512 MB covers Arrow tables held in memory while building each
    # hourly Parquet chunk. PyArrow allocators can hold reservation past
    # the apparent active set so 256m flirts with the OOM line on the
    # final flush of a big chunk.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -m parquet_export.healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6

  # ---- DuckDB cross-tier query shell (profile-gated; only runs on demand) ----
  # Resolves both `timescaledb` and `minio` via lab_net DNS — same hostnames
  # the init.sql expects. Profile keeps it out of `make up`.
  duckdb_cli:
    build:
      context: scripts
      dockerfile: duckdb_cli.Dockerfile
    profiles: ["cli"]
    networks: [lab_net]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      TSDB_USER: ${TSDB_USER:-lab}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-lab}
      TSDB_DB: ${TSDB_DB:-telemetry}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      # Match parquet_export's MINIO_ENDPOINT / PARQUET_BUCKET so the
      # cold-tier probe and init.sql cannot drift from where archives
      # are actually being written.
      MINIO_ENDPOINT: minio:9000
      PARQUET_BUCKET: ${PARQUET_BUCKET:-lab-archive}
    # The image's entrypoint (duckdb_entrypoint.sh) envsubst's the init
    # script before exec'ing duckdb, so creds stay in lock-step with .env
    # and any extra args from `make duckdb.query Q=...` pass straight
    # through after the init runs.
    stdin_open: true
    tty: true

  # ---- Control plane ----------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    networks: [lab_net]
    mem_limit: 256m
    environment:
      <<: *common-env
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-lab}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      PG_DB: ${POSTGRES_DB:-lab}
      CYCLER_HOSTS: "cycler_01:502,cycler_02:502,cycler_03:502,cycler_04:502,cycler_05:502,cycler_06:502,cycler_07:502,cycler_08:502,cycler_09:502,cycler_10:502,cycler_11:502,cycler_12:502,cycler_13:502,cycler_14:502,cycler_15:502,cycler_16:502"
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
      cycler_01: {condition: service_healthy}
      cycler_02: {condition: service_healthy}
      cycler_03: {condition: service_healthy}
      cycler_04: {condition: service_healthy}
      cycler_05: {condition: service_healthy}
      cycler_06: {condition: service_healthy}
      cycler_07: {condition: service_healthy}
      cycler_08: {condition: service_healthy}
      cycler_09: {condition: service_healthy}
      cycler_10: {condition: service_healthy}
      cycler_11: {condition: service_healthy}
      cycler_12: {condition: service_healthy}
      cycler_13: {condition: service_healthy}
      cycler_14: {condition: service_healthy}
      cycler_15: {condition: service_healthy}
      cycler_16: {condition: service_healthy}
    restart: *restart
    logging: *default-logging

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    networks: [lab_net]
    mem_limit: 256m
    environment:
      <<: *common-env
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-lab}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      PG_DB: ${POSTGRES_DB:-lab}
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_USER: ${TSDB_USER:-lab}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-lab}
      TSDB_DB: ${TSDB_DB:-telemetry}
      ANALYTICS_DQDV_BIN_MV: ${ANALYTICS_DQDV_BIN_MV:-10}
      ANALYTICS_DQDV_PEAK_HEIGHT: ${ANALYTICS_DQDV_PEAK_HEIGHT:-0.1}
      ANALYTICS_R0_JUMP_THRESHOLD_PCT: ${ANALYTICS_R0_JUMP_THRESHOLD_PCT:-20.0}
    depends_on:
      postgres: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
    restart: *restart
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -m analytics.healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6

  watchdog:
    build:
      context: .
      dockerfile: services/watchdog/Dockerfile
    networks: [lab_net]
    mem_limit: 256m
    environment:
      <<: *common-env
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-lab}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      PG_DB: ${POSTGRES_DB:-lab}
      CYCLER_HOSTS: "cycler_01:502,cycler_02:502,cycler_03:502,cycler_04:502,cycler_05:502,cycler_06:502,cycler_07:502,cycler_08:502,cycler_09:502,cycler_10:502,cycler_11:502,cycler_12:502,cycler_13:502,cycler_14:502,cycler_15:502,cycler_16:502"
      WATCHDOG_FLEET_FAIL_THRESHOLD: ${WATCHDOG_FLEET_FAIL_THRESHOLD:-8}
      WATCHDOG_FLEET_FAIL_WINDOW_S: ${WATCHDOG_FLEET_FAIL_WINDOW_S:-30}
      WATCHDOG_FLEET_FAIL_POLL_S: ${WATCHDOG_FLEET_FAIL_POLL_S:-10}
      WATCHDOG_HEARTBEAT_THRESHOLD_S: ${WATCHDOG_HEARTBEAT_THRESHOLD_S:-10}
      WATCHDOG_HEARTBEAT_POLL_S: ${WATCHDOG_HEARTBEAT_POLL_S:-2}
      WATCHDOG_CHAMBER_BREACH_BAND_C: ${WATCHDOG_CHAMBER_BREACH_BAND_C:-5.0}
      WATCHDOG_CHAMBER_BREACH_DURATION_S: ${WATCHDOG_CHAMBER_BREACH_DURATION_S:-300}
      WATCHDOG_CHAMBER_STARTUP_GRACE_S: ${WATCHDOG_CHAMBER_STARTUP_GRACE_S:-60}
      WATCHDOG_CHAMBER_CHECK_PERIOD_S: ${WATCHDOG_CHAMBER_CHECK_PERIOD_S:-5}
      WATCHDOG_CHASSIS_POLL_SIM_S: ${WATCHDOG_CHASSIS_POLL_SIM_S:-5.0}
      WATCHDOG_CHASSIS_STARTUP_GRACE_POLLS: ${WATCHDOG_CHASSIS_STARTUP_GRACE_POLLS:-1}
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
      cycler_01: {condition: service_healthy}
    restart: *restart
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -m watchdog.healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
