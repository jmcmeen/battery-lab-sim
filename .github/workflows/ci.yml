name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit + validate-schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Unit tests
        run: make test.unit

      - name: Validate schedules
        run: make validate-schedules

  integration-tests:
    # The integration suite is split into three matrix shards grouped by
    # container dependencies, so each shard pulls only the images it needs
    # and runs only its file subset. Wall time = max(shards) instead of
    # the summed ~25 min the unsharded job hit on bad days.
    #
    # Shard layout — keep file lists exhaustive; pytest will only run what
    # we name. New integration tests must be added to exactly one shard.
    name: integration (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    strategy:
      # Each shard exercises a different slice of the system. Don't cancel
      # peers when one fails — we want the full signal in one CI run.
      fail-fast: false
      matrix:
        shard:
          - name: cycler
            # In-process cycler + real Mosquitto. No DB, no MinIO, no Grafana.
            files: >-
              tests/integration/test_chamber.py
              tests/integration/test_cycler_safety.py
              tests/integration/test_cycler_watchdog.py
              tests/integration/test_chassis_chemistry.py
            images: |
              eclipse-mosquitto:2.0
          - name: orchestrator-tsdb
            # Real Mosquitto + Postgres metadata + TimescaleDB telemetry.
            files: >-
              tests/integration/test_orchestrator_resume.py
              tests/integration/test_orchestrator_unreachable.py
              tests/integration/test_analytics_pipeline.py
              tests/integration/test_continuous_aggregate.py
            images: |
              eclipse-mosquitto:2.0
              postgres:16
              timescale/timescaledb:2.16.1-pg16
          - name: storage-grafana
            # MinIO cold tier + Grafana provisioning. Heaviest containers.
            files: >-
              tests/integration/test_parquet_export.py
              tests/integration/test_grafana_provisioned.py
            images: |
              eclipse-mosquitto:2.0
              timescale/timescaledb:2.16.1-pg16
              minio/minio:RELEASE.2024-09-13T20-26-02Z
              grafana/grafana:11.2.0
    env:
      # Ryuk hangs on GH-hosted Docker; testcontainers' Python-side teardown
      # still stops every container at fixture exit.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Pre-pull Docker images for this shard
        # Parallel pre-pull bounded by shard's image list — saves ~30 s vs
        # serial testcontainers lazy-pulls. `xargs -P` parallelizes; `tr` +
        # `xargs` flatten the multi-line matrix string.
        run: |
          echo "${{ matrix.shard.images }}" | tr -s '[:space:]' '\n' | grep -v '^$' | \
            xargs -P 4 -I {} docker pull {}

      - name: Integration tests (${{ matrix.shard.name }})
        run: uv run pytest -m integration -q --durations=10 ${{ matrix.shard.files }}
