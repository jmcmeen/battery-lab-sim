name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit + validate-schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Unit tests
        run: make test.unit

      - name: Validate schedules
        run: make validate-schedules

  integration-tests:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Integration tests (real Mosquitto / Postgres / TimescaleDB / MinIO / Grafana)
        run: make test.integration
