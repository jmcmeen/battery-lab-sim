name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit + validate-schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Unit tests
        run: make test.unit

      - name: Validate schedules
        run: make validate-schedules

  integration-tests:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 25
    env:
      # Ryuk hangs on GH-hosted Docker; testcontainers' Python-side teardown
      # still stops every container at fixture exit.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      # Parallel pre-pull. Wall time = slowest single pull (TimescaleDB ~10–15s)
      # instead of the summed serial cost (~30–50s) testcontainers would pay
      # lazily during fixture startup.
      - name: Pre-pull Docker images
        run: |
          docker pull eclipse-mosquitto:2.0 &
          docker pull postgres:16 &
          docker pull timescale/timescaledb:2.16.1-pg16 &
          docker pull grafana/grafana:11.2.0 &
          docker pull minio/minio:RELEASE.2024-09-13T20-26-02Z &
          wait

      - name: Integration tests (real Mosquitto / Postgres / TimescaleDB / MinIO / Grafana)
        run: uv run pytest -m integration -q --durations=10 tests/integration
