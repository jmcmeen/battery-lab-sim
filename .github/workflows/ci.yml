name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit + validate-schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Unit tests
        run: make test.unit

      - name: Validate schedules
        run: make validate-schedules

  integration-tests:
    # The integration suite is split into three matrix shards grouped by
    # container dependencies, so each shard pulls only the images it needs
    # and runs only its file subset. Wall time = max(shards) instead of
    # the summed ~25 min the unsharded job hit on bad days.
    #
    # Shard layout — keep file lists exhaustive; pytest will only run what
    # we name. New integration tests must be added to exactly one shard.
    name: integration (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    # 20 min: local runs finish each shard in ~10 s, but CI cold-start cost
    # (uv sync on cache miss after a version bump + first-time docker pulls +
    # testcontainer fixture startup on a fresh runner) compounds. The pre-
    # split job ran at timeout-minutes: 25 and would occasionally hit it; 20
    # leaves margin without inviting silent regressions to hide.
    timeout-minutes: 20
    strategy:
      # Each shard exercises a different slice of the system. Don't cancel
      # peers when one fails — we want the full signal in one CI run.
      fail-fast: false
      matrix:
        shard:
          - name: cycler
            # In-process cycler + real Mosquitto. No DB, no MinIO, no Grafana.
            files: >-
              tests/integration/test_chamber.py
              tests/integration/test_cycler_safety.py
              tests/integration/test_cycler_watchdog.py
              tests/integration/test_chassis_chemistry.py
            images: |
              eclipse-mosquitto:2.0
          - name: orchestrator-tsdb
            # Real Mosquitto + Postgres metadata + TimescaleDB telemetry.
            files: >-
              tests/integration/test_orchestrator_resume.py
              tests/integration/test_orchestrator_unreachable.py
              tests/integration/test_analytics_pipeline.py
              tests/integration/test_continuous_aggregate.py
            images: |
              eclipse-mosquitto:2.0
              postgres:16
              timescale/timescaledb:2.16.1-pg16
          - name: storage-grafana
            # MinIO cold tier + Grafana provisioning. Heaviest containers.
            files: >-
              tests/integration/test_parquet_export.py
              tests/integration/test_grafana_provisioned.py
            images: |
              eclipse-mosquitto:2.0
              timescale/timescaledb:2.16.1-pg16
              minio/minio:RELEASE.2024-09-13T20-26-02Z
              grafana/grafana:11.2.0
    env:
      # Ryuk hangs on GH-hosted Docker; testcontainers' Python-side teardown
      # still stops every container at fixture exit.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Force-flush stdout/stderr so partial pytest output reaches the CI
      # log before a job timeout — otherwise `pytest -q` buffers everything
      # until process exit and a hang inside a test produces zero log lines.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Pre-pull Docker images for this shard
        # Parallel pre-pull bounded by shard's image list — saves ~30 s vs
        # serial testcontainers lazy-pulls. `xargs -P` parallelizes; `tr` +
        # `xargs` flatten the multi-line matrix string. Each pull capped at
        # 5 min so one image hanging at the GHCR / Docker-Hub edge surfaces
        # as a step failure rather than burning the job's whole timeout.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          echo "Pulling shard images:"
          echo "${{ matrix.shard.images }}"
          echo "${{ matrix.shard.images }}" | tr -s '[:space:]' '\n' | grep -v '^$' | \
            xargs -P 4 -I {} timeout 300 docker pull {}
          echo "Pulled. Available images matching shard:"
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | head -20

      - name: Integration tests (${{ matrix.shard.name }})
        # `-v -s --durations=0`: every test's setup/call/teardown timing
        # surfaces in the CI log in real time (combined with
        # PYTHONUNBUFFERED=1 above), so a hang inside a test or fixture
        # is identifiable from the partial log even if the job is killed.
        #
        # `timeout 720 --kill-after=30`: GNU timeout sends SIGTERM after 12
        # wall-min, then SIGKILL if pytest is still alive 30 s later. Why:
        # if `testcontainers.container.stop()` deadlocks at session
        # teardown (we disabled Ryuk, so Python-side stop is the only
        # cleanup path), the JOB timeout would kill the runner with zero
        # buffered output — `-q` mode + buffered stdout = nothing in the
        # log. The explicit `timeout` lets pytest receive SIGTERM, flush
        # whatever output it has, and exit non-zero. Job continues to the
        # `docker ps` diagnostic step below.
        run: |
          timeout --signal=TERM --kill-after=30 720 \
            uv run pytest -m integration -v -s --durations=0 ${{ matrix.shard.files }}

      - name: Docker state on failure
        if: failure()
        # If the pytest step fails or times out, dump what containers were
        # alive / dying / exited. Distinguishes "testcontainer never
        # started" from "testcontainer started but never stopped."
        run: |
          echo "=== docker ps (running) ==="
          docker ps
          echo "=== docker ps -a (all) ==="
          docker ps -a
          echo "=== container logs (last 50 lines each) ==="
          for cid in $(docker ps -aq); do
            echo "--- $cid ---"
            docker logs --tail 50 "$cid" 2>&1 || true
          done
